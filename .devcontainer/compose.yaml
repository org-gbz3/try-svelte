name: try-svelte-devcontainer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/try-svelte:cached
    command: sleep infinity
    # Codex のサンドボックスが namespace を作成できるようにする。
    security_opt:
      - seccomp:unconfined
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env}
    # ホストの DB ツールから接続でき、外部ネットワークには公開しない。
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  sqlserver-data:
